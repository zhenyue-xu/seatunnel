env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Greenplum-Gpfdist {
    url = "jdbc:postgresql://localhost:5432/testdb"
    username = "gpadmin"
    password = ""
    database = "testdb"
    table = "gpfdist_source"
    enable.gpfdist = true
    gpfdist.port = 0
    gpfdist.bind.address = "0.0.0.0"
    fetch.size = 1000
  }
}

sink {
  Greenplum-Gpfdist {
    url = "jdbc:postgresql://localhost:5432/testdb"
    username = "gpadmin"
    password = ""
    database = "testdb"
    table = "gpfdist_sink"
    enable.gpfdist = true
    gpfdist.port = 0
    gpfdist.bind.address = "0.0.0.0"
    batch.size = 1000
    flush.max.rows = 1000
    save.mode = "APPEND_DATA"
  }
}
