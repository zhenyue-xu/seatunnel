env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    parallelism = 1
    result.table.name = "fake"
    row.num = 100
    schema = {
      fields {
        id = "int"
        name = "string"
        age = "int"
        salary = "decimal(10,2)"
        description = "string"
        is_active = "boolean"
      }
    }
  }
}

sink {
  Greenplum-Gpfdist {
    url = "jdbc:postgresql://localhost:5432/testdb"
    username = "gpadmin"
    password = ""
    database = "testdb"
    table = "gpfdist_test"
    enable.gpfdist = false  # 使用简单的JDBC模式进行连通性测试
    batch.size = 100
    save.mode = "APPEND_DATA"
  }
}
